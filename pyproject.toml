[project]
name = "tbot"
version = "0.1.0"
description = "Deterministic, rule-based spot trading bot for BTC/USDT on Tabdeal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Parham" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ARG", "PTH", "TID", "ANN", "N", "DTZ"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["tbot"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts", "deploy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true

# Strict packages per CLAUDE.md section 3.7.
[[tool.mypy.overrides]]
module = ["tbot.core.*", "tbot.risk.*", "tbot.execution.*"]
strict = true

# Tests may omit return annotations; their bodies are still type-checked.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["slow: long-running tests (deselect with -m 'not slow')", "network: requires network access"]
