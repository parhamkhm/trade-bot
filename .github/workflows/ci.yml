name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: uv sync --locked --dev

      - name: No committed secrets
        run: |
          test ! -e .env || { echo "::error::.env must never be committed"; exit 1; }
          ! git ls-files | grep -E '\.(env|pem|key)$' || { echo "::error::secret-like file tracked"; exit 1; }

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy; strict on core/risk/execution)
        run: uv run mypy

      - name: Order-code audit (CLAUDE.md section 3.6 / SPEC D-052)
        run: |
          set -o pipefail
          env -u TBOT_ALLOW_ORDER_CODE uv run pytest tests/test_order_code_audit.py -q -rs | tee order_audit.log
          # NIT (round 3): a plain `grep -qi "skipped"` would also fire on any incidental line
          # that happens to contain the substring "skipped" (e.g. a future test name or docstring
          # excerpt pytest echoes back) with no real skip having occurred -- a false alarm that
          # would fail CI for the wrong reason. Match only pytest's actual skip-report shapes: a
          # per-test "SKIPPED [...]" line (`-rs`) at the start of a line, or the run summary's
          # "N skipped" count.
          if grep -Eq '^SKIPPED|[0-9]+ skipped' order_audit.log; then
            echo "::error::order-code audit test(s) were skipped in CI -- this must never happen (CLAUDE.md section 3.6 / SPEC D-052)"
            exit 1
          fi

      - name: Tests (pytest)
        run: uv run pytest
