name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: uv sync --locked --dev

      - name: No committed secrets
        run: |
          test ! -e .env || { echo "::error::.env must never be committed"; exit 1; }
          ! git ls-files | grep -E '\.(env|pem|key)$' || { echo "::error::secret-like file tracked"; exit 1; }

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy; strict on core/risk/execution)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest
